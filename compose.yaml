# Compose-Umgebung der Lauf- und CI-Vertrag-Seite (LH-QA-POR-003,
# LH-QA-OPS-001): PostgreSQL als Quelle mit Logical Decoding und der
# PG-Change-Feed-Container als CDC-Runtime. Das Image wird per
# `make image` geladen (docker buildx build --load, Tag :dev); diese Datei
# trägt bewusst keinen build:-Block — der Zweit-Build würde das geladene
# Tag vom Lauf-Beleg in harness/image-hash.txt entkoppeln (ADR-0044).
#
# Test-Daten bleiben im Container (kein Volume in den Arbeitsbaum); die
# Umgebung läuft über tools/harness/run-integration-tests.sh und wird dort
# in jedem Ausgang abgeräumt.

services:
  postgres:
    # Digest-Pin wie im Makefile (PG_TEST_IMAGE); Pin-Hebung = bewusster
    # Commit (Modul 14).
    image: postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
    container_name: cdc-test-postgres
    environment:
      POSTGRES_DB: cdc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Logical Decoding ist Vorbedingung des Replication-Streams (Slot,
    # pgoutput); wal_sender_timeout=2000 trägt dieselbe Zeitspanne wie im
    # Replication-Testcontainer (Keepalive-Antwort-Zug in Test-Zeitspanne).
    command: >-
      postgres -c wal_level=logical -c max_wal_senders=10
      -c max_replication_slots=10 -c wal_sender_timeout=2000
    # Der Init-SQL-Lauf legt das CDC-Ziel-Schema an und trägt
    # current_schema() der Rollout-Verbindung — die generated DDL des
    # d-migrate-Rollouts (ADR-0043) trägt unqualifizierte Tabellennamen und
    # landet über search_path im Schema `cdc` (SPEC-006).
    volumes:
      - ./tools/schema/compose-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdc"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - cdc-test

  pg-change-feed:
    # Das geladene Image aus `make image` (Lauf-Beleg:
    # harness/image-hash.txt); kein build:-Block in dieser Datei.
    image: ghcr.io/pt9912/pg-change-feed:dev
    container_name: cdc-test-feed
    # Der Container fährt die CDC-Runtime des Binarys: die Verdrahtung
    # (Store, Aktivierung, Stream, Service, ACK, ADR-0026) liest ihre
    # Vorbedingungen aus dieser Umgebung. Die Aktivierung — Publication,
    # Bindungs- und Schema-Version-Zeilen — trägt die Verdrahtung über
    # den EnableTable Use Case beim Start (ADR-0028, LH-FA-CFG-001.a);
    # den Slot legt der Stream beim Start selbst an.
    environment:
      # Drei rollen-spezifische DSNs statt einer gemeinsamen Instanz-DSN
      # (ADR-0047, Breaking Change ohne Fallback): die Test-Umgebung
      # verbindet sich mit dem Superuser `postgres`, weil die drei
      # Least-Privilege-Rollen (cdc_capture/cdc_admin/cdc_reader,
      # tools/schema/nacharbeit-roles.sql) NOLOGIN bleiben und diese
      # Compose-Datei keine eigenen Login-Identitäten je Rolle anlegt —
      # die reale Rollentrennung belegen die Testcontainer-Tests
      # (internal/bootstrap, make test-store), nicht dieser Integrationslauf.
      CDC_CAPTURE_DSN: postgres://postgres:postgres@cdc-test-postgres:5432/cdc?sslmode=disable
      CDC_ADMIN_DSN: postgres://postgres:postgres@cdc-test-postgres:5432/cdc?sslmode=disable
      CDC_READER_DSN: postgres://postgres:postgres@cdc-test-postgres:5432/cdc?sslmode=disable
      CDC_SOURCE_ID: src-mvp
      CDC_PUBLICATION: pub_pgc_mvp
      CDC_SLOT: slot_pgc_mvp
      CDC_TABLES: public.feed_mvp_flow=tbl-mvp-flow:sv-mvp-flow,public.feed_mvp_full=tbl-mvp-full:sv-mvp-full,public.feed_mvp_schema=tbl-mvp-schema:sv-mvp-schema
      # Log-Level des strukturierten JSON-Loggers (`LH-QA-OPS-004`,
      # slice-014); anders als die fünf Namen oben keine Start-Vorbedingung
      # — `bootstrap.parseLogLevel` fällt auf `info` zurück (leer/nicht
      # erkannt). `debug` trägt den Integrationstest-Beleg (stdout-Diff
      # der JSON-Struktur, slice-Plan §5 Closure-Trigger).
      CDC_LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
    # Kein Neustart im Container-Vertrag: die CDC-Runtime endet auf jeden
    # Adapter-Fehler mit Ausgang 1, und der Neustart-Vertrag liegt beim
    # Aufrufer — der Neustart setzt am Slot fort, confirmed_flush_lsn
    # trägt die bestätigte Position (ADR-0012). Die `transient`-Aktion der
    # Fehlerklassen-Tabelle (Erneut versuchen mit begrenztem Backoff)
    # trägt dieser Vertrag nicht.
    restart: "no"
    # Health-Endpoint per Heartbeat (LH-FA-ADM-002, LH-QA-OPS-002,
    # slice-012): der Prozess selbst befragt cdc.heartbeat über
    # `--healthcheck` (Binary-CMD statt CMD-SHELL — das distroless
    # Runtime-Image trägt weder Shell noch psql, Dockerfile) und meldet
    # den Zustand über den Exit-Code (bootstrap.Healthcheck).
    healthcheck:
      test: ["CMD", "/pg-change-feed", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - cdc-test

networks:
  cdc-test:
    # Fester Netzname: `make schema-rollout` trägt ihn über
    # SCHEMA_ROLLOUT_NETWORK, ohne vom Compose-Projektnamen abzuleiten.
    name: cdc-feed-test
