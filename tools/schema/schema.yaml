# Neutrales Schemamodell der CDC-Tabellen (ADR-0043): die Quelle der
# Schema-Form — SQL wird aus dieser Datei erzeugt, nicht mehr handgeschrieben.
# Überführt aus der handgeschriebenen DDL
# (internal/adapters/driven/postgresstorage/schema.sql); Abweichung zwischen
# DDL und dieser Datei wäre zwei Quellen für dieselbe Schema-Form
# (ADR-0043, Folgepflicht).
#
# Umfang: die Store-Seite — source, source_table, schema_version,
# transaction, change (SPEC-001, SPEC-002) — und die Consumer-State-Tabellen
# consumer, consumer_position (SPEC-001, LH-FA-CON-001…006); ihr Port
# (ConsumerStatePort) liegt außerhalb des Store-Adapters, die Tabellenform
# trägt dieses Modell wie die übrigen. process_heartbeat realisiert die in
# SPEC-001 vorgesehene Betriebs-/Capture-Zustand-Tabelle als Lebenszeichen
# des Capture-Prozesses (LH-FA-ADM-002, LH-QA-OPS-002); ihr Port
# (HeartbeatPort) liegt außerhalb des Store-Adapters, dieselbe Abgrenzung
# wie beim Consumer-State.
#
# Die drei Views (active_tables, consumer_status, changes) tragen den
# SQL-Zugriff nach LH-FA-SST-002 (Konfiguration, Status, Kernlesezugriffe)
# als eigene Driving-Adapter-Fläche (ARC-005, „SQL-Funktionen/Views"): sie
# lesen dieselben Tabellen wie der Go-Store-Adapter, ersetzen ihn aber
# nicht — Bereich/Limit/Filter tragen WHERE/LIMIT des lesenden SQL-Aufrufs,
# nicht die View selbst. active_tables bleibt bewusst auf die Bindungs- und
# Versions-Zeilen beschränkt und bildet die Publication-Mitgliedschaft
# (LH-FA-CFG-003 „aktiviert" vs. „retained") nicht nach — diese Prüfung
# bleibt Sache der Go-Use-Case-Schicht (TableActivationPort). Sie leben
# deklarativ im `views:`-Knoten unten (Pflichtfelder siehe dort).
#
# Die neutralen Tabellennamen sind unqualifiziert — das d-migrate-Modell
# trägt kein Schema-Namespace; das Ziel-Schema (`SPEC-006`, `cdc`) trägt der
# Rollout-Kontext: der Rollout-Lauf führt current_schema() über
# search_path = cdc, und die generated DDL landet dort. Die CREATE SCHEMA-
# Zeile der DDL ist Umgebungs-Vorbedingung (Compose-Init), nicht Schema-Form.
#
# `chk_change_operation` ist deklarativ unter `change.constraints` unten
# geführt, keine SQL-Nacharbeit nötig; die handgeschriebene DDL
# (internal/adapters/driven/postgresstorage/schema.sql) trägt dieselbe Form.
# Herkunft: `docs/plan/planning/observations/BEO-PGC/d-migrate-nacharbeit`.
#
# Views (active_tables, consumer_status, changes): `source_dialect:
# postgresql` und eine sichtbare `columns:`-Signatur sind Pflicht (d-migrate
# Anwenderhandbuch Anhang F.11) — ohne Signatur blockiert ein Folgelauf mit
# `VIEW_SIGNATURE_UNKNOWN`/`VIEW_SIGNATURE_INCOMPATIBLE` beim
# `ReplaceView`-Pfad. Herkunft:
# `docs/plan/planning/observations/BEO-PGC/d-migrate-nacharbeit`.
schema_format: "1.0"
name: "cdc"
version: "1.0.0"

tables:
  source:
    description: "Erfasste Quelle (SPEC-001)"
    columns:
      source_id: { type: text, required: true }
      name: { type: text, required: true }
    primary_key: [source_id]

  source_table:
    description: "Aktivierte Tabelle je Quelle (SPEC-001; LH-FA-DAT-002)"
    columns:
      source_table_id: { type: text, required: true }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      schema_name: { type: text, required: true }
      table_name: { type: text, required: true }
    primary_key: [source_table_id]
    constraints:
      - name: uq_source_table_source_schema_table
        type: unique
        columns: [source_id, schema_name, table_name]

  schema_version:
    description: "Schema-Version (SPEC-004; LH-FA-SCH-005)"
    columns:
      schema_version_id: { type: text, required: true }
      source_table_id:
        type: text
        required: true
        references: { table: source_table, column: source_table_id }
      version: { type: biginteger, required: true }
    primary_key: [schema_version_id]
    constraints:
      - name: chk_schema_version_version_range
        type: check
        expression: "(version >= 1)"

  transaction:
    description: "Persistierte Quelltransaktion (SPEC-001; LH-FA-DAT-004)"
    columns:
      transaction_id: { type: text, required: true }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      commit_position: { type: biginteger, required: true }
      # committed_at trägt den realen Quell-Commit-Zeitpunkt
      # (LH-FA-ADM-004); die Anwendung liefert ihn seit slice-018 immer
      # explizit (InsertTransaction). Die DEFAULT bleibt als Absicherung
      # für Inserts außerhalb des Anwendungscodes stehen und greift im
      # regulären Pfad nicht mehr.
      committed_at: { type: datetime, timezone: true, required: true, default: current_timestamp }
    primary_key: [transaction_id]
    indices:
      - name: cdc_transaction_source_position_idx
        columns: [source_id, commit_position]
    constraints:
      - name: chk_transaction_commit_position_positive
        type: check
        expression: "(commit_position > 0)"

  change:
    description: "Einzelner Change (SPEC-002; Row Images als jsonb, LH-FA-CAP-008)"
    columns:
      change_id: { type: text, required: true }
      transaction_id:
        type: text
        required: true
        references: { table: transaction, column: transaction_id }
      source_table_id:
        type: text
        required: true
        references: { table: source_table, column: source_table_id }
      sequence: { type: biginteger, required: true }
      operation: { type: text, required: true }
      old_data: { type: json }
      new_data: { type: json }
      schema_version:
        type: text
        required: true
        references: { table: schema_version, column: schema_version_id }
    primary_key: [change_id]
    constraints:
      - name: chk_change_operation
        type: check
        expression: "operation IN ('INSERT', 'UPDATE', 'DELETE')"
      - name: chk_change_sequence_positive
        type: check
        expression: "(sequence >= 1)"
      - name: uq_change_transaction_sequence
        type: unique
        columns: [transaction_id, sequence]

  consumer:
    description: "Registrierter Consumer (SPEC-001; LH-FA-CON-001)"
    columns:
      consumer_id: { type: text, required: true }
      name: { type: text, required: true }
    primary_key: [consumer_id]

  consumer_position:
    description: "Bestätigte Verarbeitungsposition je Consumer (SPEC-001; LH-FA-CON-003). Die Spalte trägt den bestätigten Offset der gebundenen Quelle; sie heißt acknowledged_position, weil position ein reserviertes Wort ist — der Katalog kanonisiert die Spalte mit Anführungszeichen, und der textliche Vergleich des Rollouts liest den Unterschied als Drift."
    columns:
      consumer_id:
        type: text
        required: true
        references: { table: consumer, column: consumer_id }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      acknowledged_position: { type: biginteger, required: true }
    primary_key: [consumer_id]
    constraints:
      - name: chk_consumer_position_position_positive
        type: check
        expression: "(acknowledged_position > 0)"

  process_heartbeat:
    description: "Lebenszeichen des Capture-Prozesses je Quelle (LH-FA-ADM-002, LH-QA-OPS-002). Eine Instanz trägt Quelle und CDC-Speicher gleichermaßen (Abschnitt 1 Lastenheft) — der periodische Schreib-Zug der Composition Root (ADR-0026) trägt genau eine Zeile je Quelle fort, kein eigenes Prozess-Kennungsfeld. error_class (LH-FA-ADM-003, LH-QA-REL-003) trägt den zuletzt beobachteten Fehlerzustand derselben Zeile — NULL ist Normalbetrieb, ein erfolgreicher Beat löscht die Spalte wieder."
    columns:
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      heartbeat_at: { type: datetime, timezone: true, required: true, default: current_timestamp }
      error_class: { type: text }
    primary_key: [source_id]

views:
  active_tables:
    description: "Konfigurations-Sicht: aktivierte Tabelle je Quelle mit ihrer höchsten Schema-Version (LH-FA-SST-002)"
    source_dialect: postgresql
    query: |
      SELECT
          st.source_table_id,
          st.source_id,
          st.schema_name,
          st.table_name,
          (
              SELECT max(sv.version)
              FROM cdc.schema_version sv
              WHERE sv.source_table_id = st.source_table_id
          ) AS current_schema_version
      FROM cdc.source_table st
    columns:
      - { name: source_table_id, type: text }
      - { name: source_id, type: text }
      - { name: schema_name, type: text }
      - { name: table_name, type: text }
      - { name: current_schema_version, type: bigint }

  consumer_status:
    description: "Status-Sicht: Consumer-Rückstand als Differenz von bestätigter und letzter Commit-Position (LH-FA-SST-002, LH-FA-ADM-005)"
    source_dialect: postgresql
    query: |
      SELECT
          c.consumer_id,
          c.name,
          cp.source_id,
          cp.acknowledged_position,
          (
              SELECT max(t.commit_position)
              FROM cdc.transaction t
              WHERE t.source_id = cp.source_id
          ) AS latest_commit_position
      FROM cdc.consumer c
      LEFT JOIN cdc.consumer_position cp ON cp.consumer_id = c.consumer_id
    columns:
      - { name: consumer_id, type: text }
      - { name: name, type: text }
      - { name: source_id, type: text }
      - { name: acknowledged_position, type: bigint }
      - { name: latest_commit_position, type: bigint }

  changes:
    description: "Kernlesezugriff: Changes mit Bereichs-, Limit-, Ordnungs- und Filter-Zusagen über WHERE/LIMIT des lesenden SQL-Aufrufs (LH-FA-SST-002, LH-FA-REA-001…006)"
    source_dialect: postgresql
    query: |
      SELECT
          t.source_id,
          t.commit_position,
          c.change_id,
          c.transaction_id,
          c.source_table_id,
          st.schema_name,
          st.table_name,
          c.sequence,
          c.operation,
          c.old_data,
          c.new_data,
          c.schema_version,
          t.committed_at
      FROM cdc.change c
      JOIN cdc.transaction t ON t.transaction_id = c.transaction_id
      JOIN cdc.source_table st ON st.source_table_id = c.source_table_id
      ORDER BY t.commit_position, c.transaction_id, c.sequence
    columns:
      - { name: source_id, type: text }
      - { name: commit_position, type: bigint }
      - { name: change_id, type: text }
      - { name: transaction_id, type: text }
      - { name: source_table_id, type: text }
      - { name: schema_name, type: text }
      - { name: table_name, type: text }
      - { name: sequence, type: bigint }
      - { name: operation, type: text }
      - { name: old_data, type: jsonb }
      - { name: new_data, type: jsonb }
      - { name: schema_version, type: text }
      - { name: committed_at, type: "timestamp with time zone" }
