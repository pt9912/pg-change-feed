# Neutrales Schemamodell der CDC-Tabellen (ADR-0043): die Quelle der
# Schema-Form — SQL wird aus dieser Datei erzeugt, nicht mehr handgeschrieben.
# Überführt aus der handgeschriebenen DDL
# (internal/adapters/driven/postgresstorage/schema.sql); Abweichung zwischen
# DDL und dieser Datei wäre zwei Quellen für dieselbe Schema-Form
# (ADR-0043, Folgepflicht).
#
# Umfang: die Store-Seite — source, source_table, schema_version,
# transaction, change (SPEC-001, SPEC-002) — und die Consumer-State-Tabellen
# consumer, consumer_position (SPEC-001, LH-FA-CON-001…006); ihr Port
# (ConsumerStatePort) liegt außerhalb des Store-Adapters, die Tabellenform
# trägt dieses Modell wie die übrigen. table_schema trägt die Spaltenform
# einer Schema-Version, eine Zeile je Spalte (ADR-0015 Folgepflicht,
# SPEC-004); ihr Port (SchemaStorePort) liegt ebenfalls außerhalb des
# Store-Adapters. process_heartbeat realisiert die in
# SPEC-001 vorgesehene Betriebs-/Capture-Zustand-Tabelle als Lebenszeichen
# des Capture-Prozesses (LH-FA-ADM-002, LH-QA-OPS-002); ihr Port
# (HeartbeatPort) liegt außerhalb des Store-Adapters, dieselbe Abgrenzung
# wie beim Consumer-State. administration_request trägt die Antrags-Queue
# der schreibenden SQL-Administration (ADR-0050, LH-FA-ADM-001,
# LH-FA-CFG-005, LH-FA-CAP-009) — die
# Tabelle selbst läuft über dieses Modell, die zugehörigen Funktionen
# cdc.enable_table/cdc.disable_table/cdc.exclude_column/cdc.include_column/cdc.backfill_table
# dagegen nicht: d-migrate 1.3.1 generiert
# ihre DDL korrekt (`schema generate`), aber `schema migrate --execute`
# bricht für jede function: im `functions:`-Knoten mit
# POST_EXECUTE_DRIFT (Exit 5) ab — real reproduziert auch mit einer
# trivialen No-Arg-Funktion gegen eine frische PostgreSQL-18-Instanz. Die
# Funktionen laufen deshalb über die etablierte Ausweichform
# (tools/schema/nacharbeit-administration.sql, ADR-0043
# Re-Evaluierungs-Trigger, dieselbe Klasse wie nacharbeit-roles.sql).
# Herkunft: `docs/plan/planning/observations/BEO-PGC/d-migrate-nacharbeit`.
#
# backfill_run trägt den Run-Zustand des Backfills (SPEC-029, LH-FA-CAP-009,
# ADR-0113): eine Zeile je Run, ohne SQL-Funktion und ohne Nacharbeit-Datei —
# die Tabelle läuft vollständig über dieses Modell, ihre Grants stehen in
# tools/schema/nacharbeit-roles.sql. Die fünfte View, backfill_status, liest den
# zuletzt beantragten Run je Tabelle über cdc.backfill_run und trägt die zwei
# Warn-Spalten in ihrer Signatur; ihr SELECT-Grant an cdc_reader steht ebenfalls
# in tools/schema/nacharbeit-roles.sql.
#
# Die drei Views (active_tables, consumer_status, changes) tragen den
# SQL-Zugriff nach LH-FA-SST-002 (Konfiguration, Status, Kernlesezugriffe)
# als eigene Driving-Adapter-Fläche (ARC-005, „SQL-Funktionen/Views"): sie
# lesen dieselben Tabellen wie der Go-Store-Adapter, ersetzen ihn aber
# nicht — Bereich/Limit/Filter tragen WHERE/LIMIT des lesenden SQL-Aufrufs,
# nicht die View selbst. active_tables bleibt bewusst auf die Bindungs- und
# Versions-Zeilen beschränkt und bildet die Publication-Mitgliedschaft
# (LH-FA-CFG-003 „aktiviert" vs. „retained") nicht nach — diese Prüfung
# bleibt Sache der Go-Use-Case-Schicht (TableActivationPort). Sie leben
# deklarativ im `views:`-Knoten unten (Pflichtfelder siehe dort).
#
# Eine vierte View, retention_blockers, trägt einen anderen Vertrag
# (LH-FA-RET-005, Erkennbarkeit blockierender Consumer): sie macht sichtbar,
# welcher Consumer die Löschausführung (RunRetentionUseCase,
# RetentionPolicy.AllowsDeletion) je Quelle aktuell blockiert, berechnet
# aber nichts, was die Domain-Policy nicht bereits real entscheidet — reine
# Projektion über cdc.consumer_position/cdc.consumer/cdc.transaction, im
# selben deklarativen Muster wie die übrigen drei.
#
# Die neutralen Tabellennamen sind unqualifiziert — das d-migrate-Modell
# trägt kein Schema-Namespace; das Ziel-Schema (`SPEC-006`, `cdc`) trägt der
# Rollout-Kontext: der Rollout-Lauf führt current_schema() über
# search_path = cdc, und die generated DDL landet dort. Die CREATE SCHEMA-
# Zeile der DDL ist Umgebungs-Vorbedingung (Compose-Init), nicht Schema-Form.
#
# `chk_change_operation` ist deklarativ unter `change.constraints` unten
# geführt, keine SQL-Nacharbeit nötig; die handgeschriebene DDL
# (internal/adapters/driven/postgresstorage/schema.sql) trägt dieselbe Form.
# Herkunft: `docs/plan/planning/observations/BEO-PGC/d-migrate-nacharbeit`.
#
# Views (active_tables, consumer_status, changes, retention_blockers, backfill_status):
# `source_dialect: postgresql` und eine sichtbare `columns:`-Signatur sind
# Pflicht (d-migrate Anwenderhandbuch Anhang F.11) — ohne Signatur blockiert
# ein Folgelauf mit `VIEW_SIGNATURE_UNKNOWN`/`VIEW_SIGNATURE_INCOMPATIBLE`
# beim `ReplaceView`-Pfad. Herkunft:
# `docs/plan/planning/observations/BEO-PGC/d-migrate-nacharbeit`.
schema_format: "1.0"
name: "cdc"
version: "1.0.0"

tables:
  source:
    description: "Erfasste Quelle (SPEC-001)"
    columns:
      source_id: { type: text, required: true }
      name: { type: text, required: true }
    primary_key: [source_id]

  source_table:
    description: "Aktivierte Tabelle je Quelle (SPEC-001; LH-FA-DAT-002)"
    columns:
      source_table_id: { type: text, required: true }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      schema_name: { type: text, required: true }
      table_name: { type: text, required: true }
    primary_key: [source_table_id]
    constraints:
      - name: uq_source_table_source_schema_table
        type: unique
        columns: [source_id, schema_name, table_name]

  schema_version:
    description: "Schema-Version (SPEC-004; LH-FA-SCH-005)"
    columns:
      schema_version_id: { type: text, required: true }
      source_table_id:
        type: text
        required: true
        references: { table: source_table, column: source_table_id }
      version: { type: biginteger, required: true }
    primary_key: [schema_version_id]
    constraints:
      - name: chk_schema_version_version_range
        type: check
        expression: "(version >= 1)"

  transaction:
    description: "Persistierte Quelltransaktion (SPEC-001; LH-FA-DAT-004)"
    columns:
      transaction_id: { type: text, required: true }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      commit_position: { type: biginteger, required: true }
      # committed_at trägt den realen Quell-Commit-Zeitpunkt
      # (LH-FA-ADM-004); die Anwendung liefert ihn immer explizit
      # (InsertTransaction). Die DEFAULT bleibt als Absicherung für
      # Inserts außerhalb des Anwendungscodes stehen und greift im
      # regulären Pfad nicht.
      committed_at: { type: datetime, timezone: true, required: true, default: current_timestamp }
    primary_key: [transaction_id]
    indices:
      - name: cdc_transaction_source_position_idx
        columns: [source_id, commit_position]
    constraints:
      - name: chk_transaction_commit_position_positive
        type: check
        expression: "(commit_position > 0)"

  change:
    description: "Einzelner Change (SPEC-002; Row Images als jsonb, LH-FA-CAP-008)"
    columns:
      change_id: { type: text, required: true }
      transaction_id:
        type: text
        required: true
        references: { table: transaction, column: transaction_id }
      source_table_id:
        type: text
        required: true
        references: { table: source_table, column: source_table_id }
      sequence: { type: biginteger, required: true }
      operation: { type: text, required: true }
      old_data: { type: json }
      new_data: { type: json }
      schema_version:
        type: text
        required: true
        references: { table: schema_version, column: schema_version_id }
      # origin trägt die Herkunft des Changes (SPEC-002, LH-FA-CAP-009):
      # `wal` oder `backfill`. Bewusst nullable, ohne DEFAULT und ohne
      # CHECK — NULL liest als `wal` (LH-FA-DAT-006), die geschlossene
      # Menge erzwingt die Domäne (model.ChangeOrigin), nicht die
      # Datenbank; d-migrate konvergiert eine CHECK-Änderung an einer
      # bestehenden Tabelle nicht (siehe Kopfkommentar).
      origin: { type: text }
    primary_key: [change_id]
    constraints:
      - name: chk_change_operation
        type: check
        expression: "operation IN ('INSERT', 'UPDATE', 'DELETE')"
      - name: chk_change_sequence_positive
        type: check
        expression: "(sequence >= 1)"
      - name: uq_change_transaction_sequence
        type: unique
        columns: [transaction_id, sequence]

  table_schema:
    description: "Spaltenform einer Schema-Version, eine Zeile je Spalte (ADR-0015 Folgepflicht; SPEC-004, LH-FA-SCH-004/005). Ihr Port (SchemaStorePort) liegt außerhalb des Store-Adapters, dieselbe Abgrenzung wie bei den Consumer-State-Tabellen. column_oid trägt die PostgreSQL-Typ-OID als biginteger — eine OID ist ein vorzeichenloses 32-Bit-Feld und passt nicht verlustfrei in ein vorzeichenbehaftetes integer."
    columns:
      schema_version_id:
        type: text
        required: true
        references: { table: schema_version, column: schema_version_id }
      ordinal_position: { type: biginteger, required: true }
      column_name: { type: text, required: true }
      column_oid: { type: biginteger, required: true }
    primary_key: [schema_version_id, ordinal_position]
    constraints:
      - name: chk_table_schema_ordinal_position_positive
        type: check
        expression: "(ordinal_position >= 1)"
      - name: uq_table_schema_version_column_name
        type: unique
        columns: [schema_version_id, column_name]

  consumer:
    description: "Registrierter Consumer (SPEC-001; LH-FA-CON-001)"
    columns:
      consumer_id: { type: text, required: true }
      name: { type: text, required: true }
    primary_key: [consumer_id]

  consumer_position:
    description: "Bestätigte Verarbeitungsposition je Consumer (SPEC-001; LH-FA-CON-003). Die Spalte trägt den bestätigten Offset der gebundenen Quelle; sie heißt acknowledged_position, weil position ein reserviertes Wort ist — der Katalog kanonisiert die Spalte mit Anführungszeichen, und der textliche Vergleich des Rollouts liest den Unterschied als Drift."
    columns:
      consumer_id:
        type: text
        required: true
        references: { table: consumer, column: consumer_id }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      acknowledged_position: { type: biginteger, required: true }
    primary_key: [consumer_id]
    constraints:
      - name: chk_consumer_position_position_positive
        type: check
        expression: "(acknowledged_position > 0)"

  administration_request:
    description: "Antrags-Datensatz der schreibenden SQL-Administration (ADR-0050, LH-FA-ADM-001, LH-FA-CFG-005): cdc.enable_table/cdc.disable_table/cdc.exclude_column/cdc.include_column/cdc.backfill_table (tools/schema/nacharbeit-administration.sql) schreiben ausschließlich hierher und senden pg_notify — die eigentliche Bindungs-/Publication-Änderung bleibt TableActivationAdapter vorbehalten und läuft asynchron über die Administrations-Goroutine. request_kind/status sind bewusst text mit CHECK statt eines eigenen Enum-Typs — dasselbe Muster wie change.operation. column_name trägt den Ziel-Spaltennamen der beiden Spalten-Antragsarten exclude_column/include_column; die drei Tabellen-Antragsarten enable/disable/backfill lassen sie NULL."
    columns:
      administration_request_id: { type: text, required: true }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      schema_name: { type: text, required: true }
      table_name: { type: text, required: true }
      column_name: { type: text }
      request_kind: { type: text, required: true }
      requested_at: { type: datetime, timezone: true, required: true, default: current_timestamp }
      status: { type: text, required: true, default: "pending" }
      error_message: { type: text }
    primary_key: [administration_request_id]
    # Die geschlossene request_kind-Menge steht bewusst NICHT als
    # deklarativer Check hier: d-migrate 1.3.1 konvergiert eine
    # CHECK-Änderung an einer bestehenden Tabelle nicht — real gemessen
    # (Schema-Stand ohne die vier Arten ausgerollt, dann mit ihnen:
    # POST_EXECUTE_DRIFT, Exit 5, und die bestehende Klausel entfällt dabei),
    # auch mit umbenanntem Constraint, also unabhängig vom Namen. Sie läuft
    # über die Ausweichform tools/schema/nacharbeit-administration.sql
    # (ADR-0043 §Re-Evaluierungs-Trigger), die dieselbe Menge idempotent
    # setzt — dort steht auch die Herkunft dieser Grenze.
    # chk_administration_request_status bleibt deklarativ: er ist seit der
    # Erstanlage unverändert und damit auf dem Erstanlage- wie dem
    # Vergleichsweg konvergent.
    constraints:
      - name: chk_administration_request_status
        type: check
        expression: "status IN ('pending', 'applied', 'failed')"

  process_heartbeat:
    description: "Lebenszeichen des Capture-Prozesses je Quelle (LH-FA-ADM-002, LH-QA-OPS-002). Eine Instanz trägt Quelle und CDC-Speicher gleichermaßen (Abschnitt 1 Lastenheft) — der periodische Schreib-Zug der Composition Root (ADR-0026) trägt genau eine Zeile je Quelle fort, kein eigenes Prozess-Kennungsfeld. error_class (LH-FA-ADM-003, LH-QA-REL-003) trägt den zuletzt beobachteten Fehlerzustand derselben Zeile — NULL ist Normalbetrieb, ein erfolgreicher Beat löscht die Spalte wieder."
    columns:
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      heartbeat_at: { type: datetime, timezone: true, required: true, default: current_timestamp }
      error_class: { type: text }
    primary_key: [source_id]

  backfill_run:
    description: "Run-Zustand eines Backfills des Tabellenbestands (SPEC-029, LH-FA-CAP-009, ADR-0111, ADR-0113): eine Zeile je Run, angelegt von cdc_admin bei der Annahme eines Antrags (Status queued, in derselben Transaktion wie der Antragsvermerk applied), fortgeschrieben von cdc_capture. run_id ist die administration_request_id des annehmenden Antrags. estimated_rows ist nullable: NULL heißt unbekannt, nie 0. Die zwei Warn-Spalten sind eine Kennzeichnung (false, solange keine Auswertung sie setzt). Die geschlossene status-Menge steht als CHECK bei Erstanlage, weil d-migrate eine CHECK-Änderung an einer bestehenden Tabelle nicht konvergiert (siehe Kopfkommentar)."
    columns:
      run_id: { type: text, required: true }
      source_id:
        type: text
        required: true
        references: { table: source, column: source_id }
      schema_name: { type: text, required: true }
      table_name: { type: text, required: true }
      status: { type: text, required: true }
      requested_at: { type: datetime, timezone: true, required: true, default: current_timestamp }
      started_at: { type: datetime, timezone: true }
      finished_at: { type: datetime, timezone: true }
      snapshot_position: { type: biginteger }
      rows_copied: { type: biginteger, required: true, default: 0 }
      estimated_rows: { type: biginteger }
      warn_estimated_size: { type: boolean, required: true, default: false }
      warn_duration: { type: boolean, required: true, default: false }
      error_message: { type: text }
    primary_key: [run_id]
    constraints:
      - name: chk_backfill_run_status
        type: check
        expression: "status IN ('queued', 'running', 'completed', 'failed', 'interrupted')"

views:
  active_tables:
    description: "Konfigurations-Sicht: aktivierte Tabelle je Quelle mit ihrer höchsten Schema-Version (LH-FA-SST-002)"
    source_dialect: postgresql
    query: |
      SELECT
          st.source_table_id,
          st.source_id,
          st.schema_name,
          st.table_name,
          (
              SELECT max(sv.version)
              FROM cdc.schema_version sv
              WHERE sv.source_table_id = st.source_table_id
          ) AS current_schema_version
      FROM cdc.source_table st
    columns:
      - { name: source_table_id, type: text }
      - { name: source_id, type: text }
      - { name: schema_name, type: text }
      - { name: table_name, type: text }
      - { name: current_schema_version, type: bigint }

  consumer_status:
    description: "Status-Sicht: Consumer-Rückstand als Differenz von bestätigter und letzter Commit-Position (LH-FA-SST-002, LH-FA-ADM-005)"
    source_dialect: postgresql
    query: |
      SELECT
          c.consumer_id,
          c.name,
          cp.source_id,
          cp.acknowledged_position,
          (
              SELECT max(t.commit_position)
              FROM cdc.transaction t
              WHERE t.source_id = cp.source_id
          ) AS latest_commit_position
      FROM cdc.consumer c
      LEFT JOIN cdc.consumer_position cp ON cp.consumer_id = c.consumer_id
    columns:
      - { name: consumer_id, type: text }
      - { name: name, type: text }
      - { name: source_id, type: text }
      - { name: acknowledged_position, type: bigint }
      - { name: latest_commit_position, type: bigint }

  changes:
    description: "Kernlesezugriff: Changes mit Bereichs-, Limit-, Ordnungs- und Filter-Zusagen über WHERE/LIMIT des lesenden SQL-Aufrufs (LH-FA-SST-002, LH-FA-REA-001…006)"
    source_dialect: postgresql
    query: |
      SELECT
          t.source_id,
          t.commit_position,
          c.change_id,
          c.transaction_id,
          c.source_table_id,
          st.schema_name,
          st.table_name,
          c.sequence,
          c.operation,
          c.old_data,
          c.new_data,
          c.schema_version,
          t.committed_at,
          COALESCE(c.origin, 'wal') AS origin
      FROM cdc.change c
      JOIN cdc.transaction t ON t.transaction_id = c.transaction_id
      JOIN cdc.source_table st ON st.source_table_id = c.source_table_id
      ORDER BY t.commit_position, c.transaction_id, c.sequence
    columns:
      - { name: source_id, type: text }
      - { name: commit_position, type: bigint }
      - { name: change_id, type: text }
      - { name: transaction_id, type: text }
      - { name: source_table_id, type: text }
      - { name: schema_name, type: text }
      - { name: table_name, type: text }
      - { name: sequence, type: bigint }
      - { name: operation, type: text }
      - { name: old_data, type: jsonb }
      - { name: new_data, type: jsonb }
      - { name: schema_version, type: text }
      - { name: committed_at, type: "timestamp with time zone" }
      - { name: origin, type: text }

  retention_blockers:
    description: "Retention-Sicht: je Quelle der Consumer, dessen bestätigte Position den größten Rückstand zur letzten Commit-Position trägt — genau die Position, die RetentionPolicy.AllowsDeletion (RunRetentionUseCase) aktuell als Löschgrenze der Quelle behandelt (LH-FA-RET-005). Macht die bereits real getroffene Freigabe-Entscheidung sichtbar, berechnet sie nicht neu. Ein Consumer ohne jede bestätigte Position gegen eine Quelle trägt keine Zeile in cdc.consumer_position und erscheint hier nicht — dieselbe Abwesenheits-Lesart wie ConsumerStatePort.Positions (er blockiert retentionsseitig auch nicht). Eine Quelle ohne jede bestätigte Consumer-Position erscheint deshalb gar nicht in dieser Sicht (kein aktueller Blocker)."
    source_dialect: postgresql
    query: |
      SELECT DISTINCT ON (cp.source_id)
          cp.source_id,
          c.consumer_id,
          c.name,
          cp.acknowledged_position,
          (
              SELECT max(t.commit_position)
              FROM cdc.transaction t
              WHERE t.source_id = cp.source_id
          ) - cp.acknowledged_position AS backlog
      FROM cdc.consumer_position cp
      JOIN cdc.consumer c ON c.consumer_id = cp.consumer_id
      ORDER BY cp.source_id, cp.acknowledged_position ASC, c.consumer_id ASC
    columns:
      - { name: source_id, type: text }
      - { name: consumer_id, type: text }
      - { name: name, type: text }
      - { name: acknowledged_position, type: bigint }
      - { name: backlog, type: bigint }

  backfill_status:
    description: "Backfill-Sicht: je Tabelle der zuletzt beantragte Run (größtes requested_at, Zweitschlüssel run_id) mit denselben Spalten wie cdc.backfill_run (SPEC-029, LH-FA-CAP-009, LH-FA-SST-003) — Status, Fortschritt, Zeiten, Fehlertext, die geschätzte Zeilenzahl (estimated_rows, NULL heißt unbekannt, nie 0) und die zwei Warn-Spalten (Kennzeichnung, false solange keine Auswertung sie setzt). Die Signatur trägt die Warn-Spalten von Anfang an: eine Signaturänderung einer bestehenden View kostet im Rollout ein Lesefenster (ADR-0114). cdc_reader liest ausschließlich diese View, nicht die Basistabelle."
    source_dialect: postgresql
    query: |
      SELECT DISTINCT ON (r.source_id, r.schema_name, r.table_name)
          r.run_id,
          r.source_id,
          r.schema_name,
          r.table_name,
          r.status,
          r.requested_at,
          r.started_at,
          r.finished_at,
          r.snapshot_position,
          r.rows_copied,
          r.estimated_rows,
          r.warn_estimated_size,
          r.warn_duration,
          r.error_message
      FROM cdc.backfill_run r
      ORDER BY r.source_id, r.schema_name, r.table_name, r.requested_at DESC, r.run_id DESC
    columns:
      - { name: run_id, type: text }
      - { name: source_id, type: text }
      - { name: schema_name, type: text }
      - { name: table_name, type: text }
      - { name: status, type: text }
      - { name: requested_at, type: "timestamp with time zone" }
      - { name: started_at, type: "timestamp with time zone" }
      - { name: finished_at, type: "timestamp with time zone" }
      - { name: snapshot_position, type: bigint }
      - { name: rows_copied, type: bigint }
      - { name: estimated_rows, type: bigint }
      - { name: warn_estimated_size, type: boolean }
      - { name: warn_duration, type: boolean }
      - { name: error_message, type: text }
