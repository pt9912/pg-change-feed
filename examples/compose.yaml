# Demo-/Quickstart-Umgebung unter examples/ (LH-QA-OPS-001, ADR-0098
# Festlegung 3/4). Eigenständig von der Wurzel-`compose.yaml` (Lauf-/
# CI-Vertrag-Seite, LH-QA-POR-003) — eigener Container-Satz, eigenes
# Docker-Netzwerk `cdc-examples`, eigene PostgreSQL-Instanz mit eigenen
# Daten; beide Dateien können gleichzeitig laufen (getrennte Netz-/
# Container-Namen). Das Feed-Image wird per `make image` geladen (Tag
# :dev); diese Datei trägt bewusst keinen build:-Block — der Zweit-Build
# würde das geladene Tag vom Lauf-Beleg in harness/image-hash.txt
# entkoppeln (ADR-0044).
#
# Bootstrapping (Schema-Rollout, Beispiel-Quelle/-Tabelle, Demo-Zeile)
# läuft NICHT in dieser Datei — Compose kennt keinen "nach healthy einmalig
# SQL ausführen"-Hook. Es läuft im flankierenden Skript
# examples/bootstrap.sh, gekapselt hinter `make example-demo-up`
# (harness/mk/examples.mk).
#
# Demo-Daten bleiben im Container (kein Bind-Mount für die PostgreSQL-
# Datendateien); `make example-demo-down` räumt Container und Netzwerk ab.

services:
  postgres:
    # Derselbe Digest-Pin wie die Wurzel-compose.yaml/Makefile
    # (PG_TEST_IMAGE) — Pin-Hebung bleibt ein bewusster Commit (Modul 14).
    image: postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
    container_name: cdc-examples-postgres
    environment:
      POSTGRES_DB: cdc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # wal_level=logical ist Vorbedingung des Replication-Streams (Slot,
    # pgoutput) — dieselbe Form wie die Wurzel-compose.yaml.
    command: >-
      postgres -c wal_level=logical -c max_wal_senders=10
      -c max_replication_slots=10 -c wal_sender_timeout=2000
    # Derselbe Init-Mount wie die Wurzel-compose.yaml: legt das leere
    # Schema `cdc` an und setzt den search_path der Rollout-Verbindung —
    # ohne ihn landet die unqualifizierte Tabellen-DDL des d-migrate-
    # Rollouts in `public`, während die generierten Views explizit
    # `cdc.<table>` referenzieren (real aufgetreten,
    # docs/plan/planning/observations/BEO-PGC/schema-rollout-braucht-compose-init).
    volumes:
      - ../tools/schema/compose-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdc"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - cdc-examples

  nats:
    # Digest-Pin identisch zur Wurzel-compose.yaml (ADR-0055).
    image: nats:2-alpine@sha256:065e8355c20a5575b3c77224be1855e8103fd148b68fba05130b9b8ddfa40ccc
    container_name: cdc-examples-nats
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz | grep -q ok"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - cdc-examples

  pg-change-feed:
    # Das per `make image` geladene Image (Lauf-Beleg:
    # harness/image-hash.txt); kein build:-Block (ADR-0044).
    image: ghcr.io/pt9912/pg-change-feed:dev
    container_name: cdc-examples-feed
    # Gemeinsame Umgebungsdatei-Quelle der Wahrheit (ADR-0098 Festlegung 3):
    # dieselbe Datei, die auch jedes `make example-run-*`-Ziel per
    # `--env-file` liest — DSNs, Tokens, Tabellen-/Publication-/Slot-Namen
    # und CDC_NATS_URL entstehen genau einmal, hier gelesen statt dupliziert.
    env_file:
      - .env
    environment:
      # Überschreibt die Compose-Servicenamen-Form aus examples/.env
      # (`pg-change-feed:8090`/`:9090`, gedacht für externe Clients, die
      # sich verbinden): der Prozess selbst braucht eine Bind-Adresse, kein
      # Verbindungsziel — ":8090"/":9090" binden auf allen Interfaces des
      # Containers, unabhängig vom eigenen Servicenamen.
      CDC_HTTP_ADDR: ":8090"
      CDC_GRPC_ADDR: ":9090"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    # Kein Neustart im Container-Vertrag — derselbe Vertrag wie die
    # Wurzel-compose.yaml (ADR-0012).
    restart: "no"
    healthcheck:
      test: ["CMD", "/pg-change-feed", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - cdc-examples

networks:
  cdc-examples:
    # Fester Netzname (ADR-0098 Festlegung 4): jedes `make example-run-*`-
    # Ziel hängt seinen `docker run --network cdc-examples`-Aufruf daran,
    # ohne vom Compose-Projektnamen abzuleiten — getrennt von `cdc-feed-test`
    # der Wurzel-compose.yaml.
    name: cdc-examples
