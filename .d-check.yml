# Doku-Referenz-Gate — emittiert von ai-harness-init (Adopter-Baseline).
# Startgeruest: `d-check --print-config`. Waechst mit den Artefakten.
scan:
  roots: ["."]
  # .harness/**: tool-interne Ablage (vendored Baseline, Sprachskelett) —
  # keine Adopter-Doku, vom Doc-Gate ausgenommen.
  ignore: ["**/*.template.md", ".tmp/**", ".harness/**"]
modules: [links, anchors, ids, matrix, versions, structure]
ids:
  # Kennungs-Linkpflicht (id-unlinked): nackte Kennungen muessen auf ihr
  # Definitions-Dokument verlinken. Je Stratum ein Muster; das .a-Muster
  # (Verfeinerungen, definiert im Pflichtenheft) steht vor dem Basis-
  # Muster, damit "LH-QA-REL-001.a" nicht als Lastenheft-ID matcht.
  patterns:
    - {regex: 'LH-(FA|QA)-[A-Z]{3}-\d{3}\.[a-z]', target: spec/pflichtenheft.md}
    - {regex: 'LH-(FA|QA)-[A-Z]{3}-\d{3}', target: spec/lastenheft.md}
    - {regex: 'SPEC-\d{3}', target: spec/pflichtenheft.md}
    - {regex: 'ARC-\d{3}', target: spec/architecture.md}
    - {regex: 'ADR-\d{4}', target: docs/plan/adr/}
matrix:
  # Referenz-Richtung (SDP) mechanisch — spec/ und docs/plan/ existieren.
  # Decken-Regel: kein Spec-Stratum nennt eine ADR oder einen Slice,
  # kein ADR nennt einen Slice. Innerhalb der Spec ist `direction:
  # no-downward` bewusst NICHT gesetzt: die Messmethoden des Lastenhefts
  # delegieren vertraglich an Pflichtenheft-Festlegungen (LH-QA-POR-001,
  # LH-QA-PER-002, LH-QA-PER-004 → SPEC-012/013/014); die Within-Spec-
  # Ordnung (Vertrag > Technik > Sicht) bleibt Review-Pruefpflicht.
  classes:
    - name: spec
      paths: [spec/lastenheft.md, spec/pflichtenheft.md, spec/architecture.md]
    - name: adr
      paths: ["docs/plan/adr/[0-9]*.md"]
      token: 'ADR-\d{4}'
    - name: slice
      paths: ["docs/plan/planning/**/slice-*.md"]
      token: 'slice-\d{3}'
  rules:
    - {from: spec, to: adr, allow: false}
    - {from: spec, to: slice, allow: false}
    - {from: adr, to: slice, allow: false}
  status:
    forbidden: [superseded, deprecated]
    # opt-in: ablösende Datei darf auf ihr abgelöstes (inaktives) Ziel
    # zeigen — Supersession-Linien (ADR-0039 → ADR-0038) sind legitime
    # Provenance, kein Drift.
    allow-supersede-lineage: true
    supersede-fields: [Supersedes, Status]
  # Grandfather: immutable Alt-ADRs, deren Fitness-/Folgepflicht-Zeiger auf
  # eine inzwischen abgelöste ADR zeigt (ADR-0039:121 → ADR-0036, seit
  # ADR-0041; ADR-0041:47 → ADR-0039, seit ADR-0042) — in-place-Korrektur
  # einer Accepted-ADR ist verboten (AGENTS.md §3.5); die Nachfolge-Kette
  # trägt der ADR-Index.
  exempt-paths: ["docs/plan/adr/0039-*.md", "docs/plan/adr/0041-*.md"]
versions:
  # Baseline-Pin gegen Tag-Drift: jeder Verweis in die vendored Baseline
  # traegt deren Version im Pfad; der adoptierte Stand steht einmal in
  # conventions.md §Baseline, alle abweichenden Pins sind ein Befund.
  pin-pattern: '\.harness/baseline/(v\d+\.\d+\.\d+)/'
  current-from: harness/conventions.md#baseline
  exempt-paths: ["harness/conventions/done/**"]
vcs:
  # Append-only der Adaptions-Eintraege (Modul vcs; Target `doc-immutable`
  # mit Commit-Range). Der Core einer MR-Datei bleibt ueber die Range
  # unveraendert — Eintraege werden nie ueberschrieben.
  paths: ["harness/conventions/**/MR-[0-9]*.md"]
  immutable-when: '^- \*\*Datum:\*\*'
structure:
  # Struktur-Invarianten INNERHALB der Register-Dokumente: Spalten bleiben
  # kurz und gefüllt, damit das Register als Quelle nicht driftet. Spalten
  # adressiert über Kopfzeilen-Namen (nicht Position). Zell-Laenge misst
  # wie dargestellt, inkl. Markdown-Syntax.
  - files: docs/plan/adr/README.md
    section: "# ADR-Index — PG Change Feed"
    table:
      column:
        - name: ID          # ADR-0001
          cell-min-chars: 8
          cell-max-chars: 8
        - name: Titel
          cell-min-chars: 10
          cell-max-chars: 80
        - name: Status      # Accepted | Proposed
          cell-min-chars: 5
          cell-max-chars: 10
        - name: Datum       # ISO-Datum: exakt zehn Zeichen
          cell-min-chars: 10
          cell-max-chars: 10
  - files: spec/pflichtenheft.md
    section: "## 3. Defaults und Konstanten"
    table:
      column:
        - name: ID          # `SPEC-00NN` — inkl. Backticks
          cell-min-chars: 10
          cell-max-chars: 10
        - name: Name
          cell-min-chars: 3
          cell-max-chars: 40
        - name: Wert
          cell-min-chars: 1
          cell-max-chars: 120
        - name: Begründung
          cell-min-chars: 10
          cell-max-chars: 220
  - files: spec/architecture.md
    section: "## 1. Komponenten-Übersicht"
    table:
      column:
        - name: ID          # `ARC-00NN` — inkl. Backticks
          cell-min-chars: 9
          cell-max-chars: 9
        - name: Komponente
          cell-min-chars: 3
          cell-max-chars: 40
        - name: Rolle
          cell-min-chars: 10
          cell-max-chars: 220
  - files: spec/architecture.md
    section: "## 3. Externe Abhängigkeiten"
    table:
      column:
        - name: ID          # `ARC-00NN` — inkl. Backticks
          cell-min-chars: 9
          cell-max-chars: 9
        - name: System
          cell-min-chars: 3
          cell-max-chars: 60
        - name: Rolle
          cell-min-chars: 10
          cell-max-chars: 120
        - name: Substituierbarkeit
          cell-min-chars: 10
          cell-max-chars: 200
  # Fuenfte Regel — AKTIVIERT mit der ERSTEN Closure (slice-001/slice-002
  # in done/, 2026-09-09): Closure-Notiz je Slice vorhanden, gefuellt,
  # Lerneintrag enthalten, keine offenen Aufgaben.
  - files: "docs/plan/planning/done/slice-*.md"
    section: "## 7. Closure-Notiz"
    non-empty: true
    max-open-tasks: 0
    require-pattern: "Steering-Loop"
    hint: "Closure-Notiz je Slice (§7): Steering-Loop-Lerneintrag, keine offenen Aufgaben; Ausgaenge je Risiko im Slice-Plan."
reviews:
  # Review-Report-Deckung fuer done/-Slices mit Review-DoD-Haken —
  # aktiviert mit der ERSTEN Closure (slice-001/slice-002 in done/,
  # 2026-09-09).
  done-dir: docs/plan/planning/done
  reviews-dir: docs/reviews
# codepaths: aktivieren, sobald alle in Doku referenzierten Pfade existieren
# (z. B. nennt spec/architecture.md den Roadmap-Pfad, der erst mit der
# ersten Welle angelegt wird) — sonst behaupteter, aber roter Gate
# (Modul 13, LH-QA-01).
# commits: Traceability-Kennung in Commit-Messagen (opt-in, git) — die
# positive Haelfte des Commit-Traceability-Gates (ADR-0045): je Message der
# Standing-Range (make-Target commit-traceability, Default HEAD~5..HEAD)
# mindestens eine Vertrags-Kennung, sonst Befund commit-untraceable. Die
# Grenz-Haelfte (keine Struktur-ID im Betreff) prueft im selben Target
# tools/harness/commit-traceability.sh — das commits-Modul kennt heute
# keine verbotene-Muster-Option. Kein slice-Kennungs-Muster: der Commit
# nennt den Vertrag, nicht den Lifecycle-Plan.
commits:
  id-patterns:
    - 'ADR-\d{4}'
    - 'LH-(FA|QA)-[A-Z]{3}-\d{3}(\.[a-z])?'
  exempt-pattern: '^(Merge |Revert )'
