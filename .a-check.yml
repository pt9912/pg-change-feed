# .a-check.yml — Architektur-Regeln für a-check (Modul: hexagonale Schichten).
# Die Schichten/Edges bilden die Sicht-Stratum-Constraints ab
# (spec/architecture.md §1/§2; ADR-0002, ADR-0039) — die Maschinenform der
# Abhängigkeitsregel, die bis hierhin Review-Prüfpflicht war (ADR-0036).
# Gerüst: `a-check --print-config`; strikt dekodiert — unbekannte Schlüssel
# brechen mit Exit 2 ab.
version: 1
languages:
  go: ["**/*.go"]
layers:
  domain:   ["internal/domain/**"]
  ports:    ["internal/application/port/**"]
  app:      ["internal/application/usecase/**"]
  adapters: ["internal/adapters/**"]
  # `tooling` ist keine Komponente der Sicht (§2), sondern die Gate-Scope-
  # Gruppe der Wegwerf-Clients unter `tools/harness/**`. Sie sprechen den
  # gRPC-Stream über den erzeugten Protokoll-Stub der Vertragsfläche
  # (`gen/cdc/stream/v1`, Gruppe `contract`) real über das Netz an und
  # verdrahten nichts (ADR-0068; der Stub zog mit `slice-097` von
  # `internal/adapters/driving/grpc/streamv1` an diesen öffentlichen Pfad um —
  # `ADR-0076`).
  tooling:  ["tools/harness/**"]
  # `examples` ist keine Komponente der Sicht (§2), sondern die Gate-Scope-
  # Gruppe der öffentlichen Beispiel-Clients unter `examples/**`
  # (ADR-0076/ADR-0079). Ihre Clients benutzen ausschließlich die
  # Standardbibliothek und öffentliche Fremdmodule: `examples/http-client`
  # ruft den `reader`-Endpunkt `GET /tables` an, `examples/sse-client` den
  # Endpunkt `GET /changes/stream`, `examples/grpc-client` öffnet den
  # Server-Stream `ChangeStream/StreamChanges` über den erzeugten Protokoll-
  # Stub der Vertragsfläche (`gen/cdc/stream/v1`, Gruppe `contract`), und
  # `examples/nats-client` spricht das Wecksignal über
  # `github.com/nats-io/nats.go` samt nachfolgender HTTP-Abfrage an — ohne
  # einen Bereich von `domain`, `ports`, `app` oder `adapters` zu
  # importieren. Ein Import aus einer dieser vier Gruppen in `examples/**`
  # bleibt `wrong-direction`.
  examples: ["examples/**"]
  # `contract` ist keine Komponente der Sicht (§2), sondern die Gate-Scope-
  # Gruppe der erzeugten Vertragsfläche unter `gen/**` (`slice-097`,
  # `ADR-0076`): der aus `proto/cdc/stream/v1/changestream.proto` erzeugte
  # Go-Code, umgezogen vom privaten `internal/adapters/driving/grpc/streamv1`
  # an diesen öffentlichen Pfad, damit sowohl `adapters` als auch `tooling`
  # ihn referenzieren können, ohne dass eine der beiden Gruppen die andere
  # referenziert.
  contract: ["gen/**"]
edges:
  # Abhängigkeiten zeigen nach innen (ADR-0002): Ports und Use Cases
  # referenzieren die Domain; Adapter referenzieren Ports und Domain-Typen
  # (Mapper übersetzen, ADR-0039) — nicht umgekehrt.
  - {from: ports,    to: domain}
  - {from: app,      to: domain}
  - {from: app,      to: ports}
  - {from: adapters, to: ports}
  - {from: adapters, to: domain}
  # `adapters` → `contract` (neu, `slice-097`): `server.go` importiert den
  # erzeugten Protokoll-Stub jetzt vom öffentlichen Pfad `gen/cdc/stream/v1`.
  - {from: adapters, to: contract}
  # `tooling` → `contract` (neu, `slice-097`): `tools/harness/grpcclient`
  # importiert denselben Stub vom öffentlichen Pfad.
  - {from: tooling,  to: contract}
  # `examples` → `contract` (neu, `slice-095`): `examples/grpc-client`
  # importiert den erzeugten Protokoll-Stub vom öffentlichen Pfad
  # `gen/cdc/stream/v1`, genau wie `adapters` und `tooling` es bereits tun.
  - {from: examples, to: contract}
  # `tooling` → `adapters` ist mit `slice-097` ZURÜCKGENOMMEN: Die Kante
  # (ADR-0068) trug ausschließlich den Zugriff auf den Protokoll-Stub, der
  # damals unter `internal/adapters/driving/grpc/streamv1` lag. Der Stub
  # liegt jetzt unter `gen/cdc/stream/v1` (Gruppe `contract`, siehe oben) —
  # die Kante ist damit gegenstandslos und entfällt. Ein Import aus `app`,
  # `ports`, `domain` oder `adapters` in `tools/harness/**` bleibt
  # `wrong-direction`.
# Composition Root (`ADR-0026`): die Verdrahtung konkreter Adapter lebt in
# `internal/bootstrap` und `cmd` — und in den Verdrahtungs-Tests, die
# denselben Aufbau als Test tragen (MVP-Integrationstest gegen die
# Compose-Umgebung, `test/integration`).
composition_root: ["internal/bootstrap/**", "cmd/**", "test/integration/**"]
markers:
  ignore_symbols: []
