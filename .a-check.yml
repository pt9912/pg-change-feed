# .a-check.yml — Architektur-Regeln für a-check (Modul: hexagonale Schichten).
# Die Schichten/Edges bilden die Sicht-Stratum-Constraints ab
# (spec/architecture.md §1/§2; ADR-0002, ADR-0039) — die Maschinenform der
# Abhängigkeitsregel, die bis hierhin Review-Prüfpflicht war (ADR-0036).
# Gerüst: `a-check --print-config`; strikt dekodiert — unbekannte Schlüssel
# brechen mit Exit 2 ab.
version: 1
languages:
  go: ["**/*.go"]
layers:
  domain:   ["internal/domain/**"]
  ports:    ["internal/application/port/**"]
  app:      ["internal/application/usecase/**"]
  adapters: ["internal/adapters/**"]
  # `tooling` ist keine Komponente der Sicht (§2), sondern die Gate-Scope-
  # Gruppe der Wegwerf-Clients unter `tools/harness/**`. Sie sprechen den
  # gRPC-Stream über den erzeugten Protokoll-Stub des Adapters
  # (`internal/adapters/driving/grpc/streamv1`) real über das Netz an und
  # verdrahten nichts (ADR-0068).
  tooling:  ["tools/harness/**"]
  # `examples` ist keine Komponente der Sicht (§2), sondern die Gate-Scope-
  # Gruppe der öffentlichen Beispiel-Clients unter `examples/**`
  # (ADR-0076/ADR-0079). Ihre Clients benutzen ausschließlich die
  # Standardbibliothek und öffentliche Fremdmodule: `examples/http-client`
  # ruft den `reader`-Endpunkt `GET /tables` an, `examples/sse-client` den
  # Endpunkt `GET /changes/stream`, und `examples/nats-client` spricht das
  # Wecksignal über `github.com/nats-io/nats.go` samt nachfolgender
  # HTTP-Abfrage an — ohne einen Bereich dieses Baums zu importieren. Die
  # Gruppe trägt deshalb keine Kante (ADR-0079 Festlegung 1); ein Import aus
  # `domain`, `ports`, `app` oder `adapters` in `examples/**` bleibt
  # `wrong-direction`.
  examples: ["examples/**"]
edges:
  # Abhängigkeiten zeigen nach innen (ADR-0002): Ports und Use Cases
  # referenzieren die Domain; Adapter referenzieren Ports und Domain-Typen
  # (Mapper übersetzen, ADR-0039) — nicht umgekehrt.
  - {from: ports,    to: domain}
  - {from: app,      to: domain}
  - {from: app,      to: ports}
  - {from: adapters, to: ports}
  - {from: adapters, to: domain}
  # `tooling` → `adapters` ist die einzige Berechtigung dieser Gruppe: der
  # Zugriff auf den Protokoll-Stub. Ein Import aus `app`, `ports` oder
  # `domain` in `tools/harness/**` bleibt `wrong-direction` (ADR-0068).
  - {from: tooling,  to: adapters}
# Composition Root (`ADR-0026`): die Verdrahtung konkreter Adapter lebt in
# `internal/bootstrap` und `cmd` — und in den Verdrahtungs-Tests, die
# denselben Aufbau als Test tragen (MVP-Integrationstest gegen die
# Compose-Umgebung, `test/integration`).
composition_root: ["internal/bootstrap/**", "cmd/**", "test/integration/**"]
markers:
  ignore_symbols: []
