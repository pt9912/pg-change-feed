// Live change stream: one server-streaming call that delivers every committed
// change of the captured tables with its full content to each connected
// consumer. The stream is fire-and-forget and has no replay.
syntax = "proto3";

package cdc.stream.v1;

option go_package = "github.com/pt9912/pg-change-feed/gen/cdc/stream/v1;streamv1";

// Change is one captured change. The fields match the change of the HTTP and
// SSE surfaces (without the commit position, commit time and origin).
// old_image and new_image carry the raw row-image bytes (JSON) unchanged; the
// stream does not interpret them.
message Change {
  string change_id = 1;
  string transaction_id = 2;
  string source_table_id = 3;
  int64 sequence = 4;
  string operation = 5;
  bytes old_image = 6;
  bytes new_image = 7;
  string schema_version = 8;
  string schema = 9;
  string table = 10;
}

// StreamChangesRequest carries no filter: a subscriber receives the changes of
// all captured tables.
message StreamChangesRequest {}

// ChangeStream offers the live change stream.
service ChangeStream {
  // StreamChanges opens the server stream and delivers every change that
  // arrives after the connection is established. A call without valid
  // authentication ends with gRPC status UNAUTHENTICATED.
  rpc StreamChanges(StreamChangesRequest) returns (stream Change);
}
