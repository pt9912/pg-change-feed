[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgchangefeed"
version = "0.2.1"
# The README lives one level above this file (sdks/python/README.md);
# setuptools accepts no `readme` path outside the project directory, so the
# Docker build (sdks/python/Dockerfile) copies it next to this file.
description = "Official Python client library for PG Change Feed (HTTP API, gRPC and SSE live-change streams, NATS full-content stream)."
readme = "README.md"
license = "MIT"
authors = [{ name = "pt9912" }]
requires-python = ">=3.14"
# Runtime dependencies per client: httpx carries the HTTP and SSE clients
# (src/pgchangefeed/http_client.py, sse_client.py); grpcio and protobuf carry
# the gRPC client (src/pgchangefeed/grpc_client.py) -- protobuf because the
# stub modules generated at build time (src/pgchangefeed/grpc_gen/, not
# committed) import the protobuf runtime; nats-py carries the NATS client
# (src/pgchangefeed/nats_stream_client.py). The package imports nothing from
# a private tree of this repository.
dependencies = [
    "httpx>=0.27",
    "grpcio>=1.75",
    "protobuf>=6",
    "nats-py>=2",
]

keywords = ["postgresql", "change-data-capture", "cdc", "logical-replication", "change-feed"]

[project.urls]
Homepage = "https://github.com/pt9912/pg-change-feed"
Documentation = "https://github.com/pt9912/pg-change-feed/blob/main/docs/user/benutzerhandbuch.md"
Repository = "https://github.com/pt9912/pg-change-feed"
Issues = "https://github.com/pt9912/pg-change-feed/issues"

[project.optional-dependencies]
test = ["pytest>=8", "grpcio-tools>=1.75"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# A bare `pytest` run (Dockerfile stage `build`, `RUN pytest`) collects only
# the network-free unit tests: the real-server tests live under
# pgchangefeed/integration/ and need a running server; they run only in the
# `integration` Docker stage, which passes an explicit path.
testpaths = ["tests"]
