[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgchangefeed"
version = "0.1.0"
# README.md liegt eine Ebene hoeher (sdks/python/README.md, Sprachwurzel-
# Ebene, analog sdks/csharp/README.md) -- setuptools erlaubt fuer `readme`
# aber keinen Pfad ausserhalb des Projekt-Wurzelverzeichnisses (real geprueft:
# `DistutilsOptionError: Cannot access '.../README.md' (or anything outside
# '...')`, Plan-Nachzug §3). Der Docker-Bau (sdks/python/Dockerfile) kopiert
# die Datei deshalb an diese lokale Stelle -- dasselbe Muster wie die
# `.proto`-Einspeisung in sdks/csharp/Dockerfile (COPY an eine vom
# Projekt erwartete relative Stelle, ohne sie im committeten Baum zu
# duplizieren).
description = "Official Python client library for PG Change Feed (HTTP API)."
readme = "README.md"
license = "MIT"
authors = [{ name = "pt9912" }]
requires-python = ">=3.14"
# Einzige Fremdabhaengigkeit (ADR-0107 Festlegung 1: httpx, keine weitere,
# keine schwere Fremdabhaengigkeit) -- wird von der HTTP-API-Client-Flaeche
# (src/pgchangefeed/http_client.py) fuer die HTTP-Requests genutzt.
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/pt9912/pg-change-feed"
Repository = "https://github.com/pt9912/pg-change-feed"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
