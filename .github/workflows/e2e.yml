---
name: e2e

# Black-Box-E2E-Workflow (ADR-0051 Entscheidung 2, Folgepflicht): laeuft auf
# jeden Pull Request und jeden Branch-Push, wie `ci.yml` (Tag-Pushes
# ausgenommen, `tags-ignore: ['**']`). Anders als `ci.yml` ist dieser
# Workflow bewusst **kein** Required-Status-Check (Repository-Einstellung,
# nicht Teil dieser Datei) — ein roter Lauf ist sichtbar, blockiert aber
# keinen Merge (LH-QA-POR-003: vollstaendige Testumgebung automatisiert und
# reproduzierbar, ohne `ci.yml`s kurzes Signal durch den deutlich laengeren
# Compose-Stack-Aufbau zu verzoegern).
#
# Ruft die bestehenden `make`-Targets auf (AGENTS.md §3.1, Docker-only):
# `make image` baut das lokale Image (`ghcr.io/pt9912/pg-change-feed:dev`), das
# `compose.yaml` ohne eigenen `build:`-Block referenziert (ADR-0044) — ohne
# diesen Schritt haette `make test-integration` kein Image zum Laden und der
# Compose-Start schluege fehl. `make test-integration` faehrt danach den vollen
# Compose-Stack samt Schema-Rollout und mehreren Testphasen (Rollen-DSN,
# Retention-Lebenszyklus, Black-Box-CLI-Rundlauf, drei NATS-Testabschnitte)
# — kein Gate ([`ADR-0030`](../../docs/plan/adr/0030-testpyramide.md)),
# aber der konkreteste Beleg fuer LH-QA-POR-003.
#
# Einzige Ausnahme von den `make`-Aufrufen: die beiden Replication-Phasen der
# DB-Adapter-Coverage werden direkt ueber das Traeger-Skript aufgerufen
# (`tools/harness/run-replication-tests.sh measure|tier`) — dasselbe Skript, das
# `make test-replication` implementiert, hier mit je eigenem Exit je Phase; ein
# Make-Target je Phase gibt es nicht. Sonst enthaelt kein Workflow-Schritt
# ziel-eigene Inline-Shell-Logik; die eine Ausnahme oben ruft dasselbe
# Traeger-Skript wie `make test-replication` und dupliziert nichts.
#
# Timeout 60 Minuten (ci.yml: 30) — `make test-integration` traegt mehrere
# feste Wartephasen (Retention-Alters-/Lag-Schwellen, NATS-Reconnect-Timing)
# zusaetzlich zum Compose-Hochfahren und Schema-Rollout; ein
# GitHub-hosted Runner kann dabei langsamer sein als eine lokale
# Entwicklungsumgebung. Ob das Zeitlimit real ausreicht, bleibt bis zum
# ersten echten Lauf offen (`BEO-PGC/github-actions-unverifizierbar-lokal`).
#
# Action-Pinning (AGENTS.md §3.8): jede `uses:`-Zeile SHA-gepinnt mit
# Tag-Kommentar. `fetch-depth: 0` ist hier nicht noetig — dieser Workflow
# ruft `make commit-traceability` nicht auf, der Standard-Checkout reicht.
#
# PostgreSQL-Versionsmatrix (LH-QA-POR-001, SPEC-012, ADR-0058 Entscheidung
# 4): zwei Matrix-Legs ueber die in SPEC-012 festgelegten Digests
# (postgres:17-alpine, postgres:18-alpine), GitHub Actions fuehrt sie
# standardmaessig parallel aus (`fail-fast: false`, damit ein rotes Leg das
# andere nicht abbricht — beide Ergebnisse bleiben sichtbar, der Workflow ist
# ohnehin nicht-blockierend). Jedes Leg setzt PG_TEST_IMAGE auf Job-Ebene;
# `compose.yaml`s `${PG_TEST_IMAGE}`-Interpolation liest die Variable aus der
# Prozessumgebung, `make image`/`make test-integration` laufen unveraendert.
# Der PostgreSQL-17-Digest ist real ueber `docker manifest inspect
# postgres:17-alpine` (amd64, ermittelt 2026-09-14) gepinnt — Pin-Hebung =
# bewusster Commit (Modul 14).

"on":
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

# Top-level: alles entziehen; der Job lockert nur, was er braucht.
permissions: {}

jobs:
  e2e:
    name: image + test-integration (PostgreSQL ${{ matrix.pg_major }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # PostgreSQL 17 (SPEC-012, LH-QA-POR-001): Digest via
          # `docker manifest inspect postgres:17-alpine` (amd64, real
          # ermittelt 2026-09-14).
          - pg_major: "17"
            pg_test_image: postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
          # PostgreSQL 18 (SPEC-012, LH-QA-POR-001): derselbe Digest-Pin wie
          # Makefile PG_TEST_IMAGE / compose.yaml-Default.
          - pg_major: "18"
            pg_test_image: postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
    env:
      PG_TEST_IMAGE: ${{ matrix.pg_test_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image bauen (Lauf-Beleg harness/image-hash.txt)
        run: make image

      - name: Compose-Integrationstest (Black-Box-E2E)
        run: make test-integration

      # DB-Adapter-Coverage (ADR-0071 Punkt 3, kein Gate): die zwei
      # Traeger-Laeufe erzeugen je ein -coverprofile ueber den
      # DB-Adapter-Gegenstand; die Replication-Phase `measure` mergt beide und
      # prueft die Schwelle (tools/harness/db-coverage.sh,
      # DB_COVERAGE_THRESHOLD). Reihenfolge store -> replication ist Bedingung
      # des Merges. Die Schritte stehen NACH `make test-integration`, damit sie
      # dessen Ergebnis nicht verdecken; `make test-store` braucht kein
      # vorheriges `make image`.
      #
      # Die beiden Replication-Phasen laufen als ZWEI Schritte ueber das
      # Traeger-Skript (seine Implementierung ist `make test-replication`, ein
      # eigenes Make-Target je Phase gibt es nicht): `measure` traegt das
      # Verdikt der Messung, `tier` den Tier-weiten `go test ./...` und den
      # Slot-Reserve-Lauf des Snapshot-Adapters (eigener PostgreSQL mit
      # `max_replication_slots=1`). Sie sind getrennt, weil der Tier-Lauf
      # `go test ./...` ueber den ganzen Baum
      # fuehrt — in einem gemeinsamen Schritt verschluckte sein Exit das Verdikt
      # der Messung. Der `tier`-Schritt rollt das CDC-Schema vor dem Lauf aus
      # (tools/schema/apply-rollout.sh, ADR-0043), weil die
      # internal/bootstrap-Fixtures `bootstrap.Run` real starten und dessen
      # Lesezugriffe brauchen; die Messung darueber laeuft ohne diesen Schritt.
      - name: DB-Adapter-Coverage — Store-Teil (Profil)
        run: make test-store

      - name: DB-Adapter-Coverage — Replication-Teil, Merge + Schwelle
        run: bash tools/harness/run-replication-tests.sh measure

      - name: Replication-Tier (go test ./... und Slot-Reserve)
        run: bash tools/harness/run-replication-tests.sh tier
